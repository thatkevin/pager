<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — PAGER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #ebebeb;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13.5px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Scanline overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,.06) 2px,
        rgba(0,0,0,.06) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    .panel {
      text-align: center;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      animation: fade-up 600ms ease both;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo */
    @keyframes logo-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    .logo {
      display: inline-block;
      margin-bottom: 28px;
      animation: logo-float 3.5s ease-in-out infinite;
      filter: drop-shadow(0 4px 14px rgba(189,207,70,.2));
    }

    /* 404 heading */
    @keyframes glitch {
      0%, 92%, 100% { text-shadow: none; clip-path: none; }
      93%  { text-shadow: -3px 0 #bdcf46, 3px 0 #78a3ad; }
      94%  { text-shadow: 3px 0 #bdcf46, -3px 0 #78a3ad; clip-path: inset(10% 0 60% 0); }
      95%  { text-shadow: none; clip-path: none; }
      96%  { text-shadow: -2px 0 #78a3ad, 2px 0 #bdcf46; clip-path: inset(55% 0 10% 0); }
      97%  { text-shadow: none; clip-path: none; }
    }

    .four-oh-four {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(36px, 10vw, 56px);
      color: #ebebeb;
      letter-spacing: 0.06em;
      line-height: 1;
      margin-bottom: 20px;
      animation: glitch 5s steps(1) infinite;
    }

    .subtitle {
      font-family: 'VT323', monospace;
      font-size: 28px;
      letter-spacing: 0.1em;
      color: #777;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .body-text {
      font-size: 13px;
      color: #555;
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .body-text em {
      color: #444;
      font-style: normal;
      font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
      font-size: 12px;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'VT323', monospace;
      font-size: 22px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #bdcf46;
      text-decoration: none;
      border: 1px solid rgba(189,207,70,.25);
      border-radius: 2px;
      padding: 8px 20px;
      transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
    }

    .home-link:hover {
      background: rgba(189,207,70,.08);
      border-color: rgba(189,207,70,.5);
      color: #d4e85a;
    }

    .home-link:active { opacity: 0.7; }

    .footnote {
      margin-top: 40px;
      font-size: 11px;
      color: #2a2a2a;
      font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
    }
  </style>
</head>
