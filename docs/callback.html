<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PAGER</title>
  <link rel="stylesheet" href="css/fonts.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #ebebeb;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 13.5px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .panel {
      text-align: center;
      padding: 40px 28px;
      max-width: 360px;
      width: 100%;
    }
    .wordmark {
      font-family: 'Press Start 2P', monospace;
      font-size: 18px;
      letter-spacing: 0.05em;
      margin-bottom: 40px;
    }
    .status { color: #777; line-height: 1.6; }
    .error {
      color: #ef4444;
      background: rgba(239,68,68,.08);
      border: 1px solid rgba(239,68,68,.2);
      border-radius: 2px;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.6;
    }
    .spinner {
      width: 14px; height: 14px;
      border: 1.5px solid #232323;
      border-top-color: #777;
      border-radius: 50%;
      animation: spin 600ms linear infinite;
      display: inline-block;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="panel">
    <div class="wordmark">PAGER</div>
    <div id="status" class="status">
      <span class="spinner"></span> Logging in…
    </div>
  </div>

  <script type="module">
    import { CONFIG } from './js/config.js';

    const statusEl = document.getElementById('status');
    const params   = new URLSearchParams(location.search);
    const code     = params.get('code');
    const state    = params.get('state');
    const saved    = sessionStorage.getItem('pager_oauth_state');

    function showError(msg) {
      statusEl.innerHTML = '';
      const el = document.createElement('div');
      el.className    = 'error';
      el.textContent  = msg;
      statusEl.appendChild(el);
    }

    if (!code) {
      showError('No authorisation code returned from GitHub.');
    } else if (!saved || state !== saved) {
      showError('Invalid state — possible CSRF. Try logging in again.');
    } else {
      sessionStorage.removeItem('pager_oauth_state');
      try {
        const res  = await fetch(`${CONFIG.workerUrl}/exchange`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body:    new URLSearchParams({ code }).toString(),
        });
        const data = await res.json();
        if (data.token) {
          localStorage.setItem('cms_gh_token', data.token);
          location.replace('./');
        } else {
          showError(data.error || 'Login failed. Try again.');
        }
      } catch (e) {
        showError('Could not reach the auth worker. ' + e.message);
      }
    }
  </script>
</body>
</html>
